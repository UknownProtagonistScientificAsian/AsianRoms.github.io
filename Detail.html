<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Roms in Detail</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #fff;
            padding: 50px;
        }
        h1 {
            color: #333;
            font-size: 36px;
            margin-bottom: 50px;
        }
        .categories {
            display: flex;
            justify-content: space-around;
            max-width: 800px;
            margin: 0 auto;
        }
        .category {
            font-size: 24px;
            font-weight: bold;
            padding: 20px;
            border: 2px solid #333;
            border-radius: 10px;
            width: 150px;
            transition: transform 0.3s, background-color 0.3s;
        }
        .category:hover {
            background-color: #f2f2f2;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <h1>Welcome to the Roms in Detail</h1>
    <div class="categories">
        <div class="category">Pokémon</div>
        <div class="category">Soccer</div>
        <div class="category">Kirby</div>
        <div class="category">Street Basketball</div>
    </div>
</body>
</html>
